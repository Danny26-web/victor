<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="Danny Jay">
    <meta nam="description" content="Contact information for The 
    Little Paco Shop">
    <title>Contact Us - LPS</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <header>
        <h1> Contact Us</h1>
        <nav>
            <ul>

                <li>
                    <a href="/#about">About <abbr title="The Little 
                    Paco Shop">LTS</abbr></a>
                </li>
                <li>
                    <a href="/#menu">Our Menu</a>
                </li>
                <li>
                    <a href="hours.html">Store Hours</a>
                </li>
            </ul>
        </nav>

        <figure>
            <img src="img/oppol.jpg" alt="Little Paco Shop Pacos" title="Fighters ready to fight!" width="400"
                height="260" id="img1">
            <figcaption>
                Little Paco Shop Pacos
            </figcaption>
        </figure>
    </header>
    <hr>
    <main>
        <section>
            <h2>Our Contact form</h2>

            <form action="https://httpbin.org/get" method="get">
                <fieldset>
                    <legend>Send Us A Message</legend>
                    <p>
                        <label for="name">Name:</label>
                        <input type="text" name="name" id="name" placeholder="your name" required>
                    </p>
                    <p>
                        <label for="email">Email:</label>
                        <input type="email" name="email" id="email" placeholder="your email" required>
                    </p>
                    <p>
                        <label for="Message">Your Message:</label>
                        <br>
                        <textarea name="message" id="message" cols="30" rows="10"
                            placeholder="Type your message here"></textarea>
                    </p>
                </fieldset>
                <button type="submit">Send</button>
                <button type="reset">Reset</button>
            </form>
        </section>
        <section>
            <h2>Our Location</h2>
            <address>
                166 Ifesowapo Irewawade street, Suite F<br>
                Ife City, To 66488-5567
                <br><br>
                Phone: <a href="tel:
                +234-8033267501 or +234-9119390793">08033267501 or 09119390793</a>
            </address>
        </section>
    </main>
    <hr>
    <footer>
        <p> The Little Pacos Shop</p>
    </footer>
</body>

</html>
